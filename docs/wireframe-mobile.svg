<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3182" viewBox="0 0 390 3182" role="img" aria-labelledby="title desc"><title id="title">Wireframe de catering para celular</title><desc id="desc">Vistas consecutivas de catálogo, formulario, revisión, confirmación y consulta. Las flechas indican destinos.</desc><rect width="100%" height="100%" fill="#f5f5f5"/><g font-family="Arial, sans-serif" fill="#222"><text x="20" y="32" font-size="14" font-weight="700">TALLER S7 · WIREFRAME</text><text x="20" y="57" font-size="14" font-weight="400">Celular · 390 px</text><text x="20" y="82" font-size="14" font-weight="400">Secuencia de vistas · leer de arriba abajo</text><rect x="20" y="108" width="350" height="116" rx="4" fill="#eee" stroke="#777"/><text x="36" y="138" font-size="22" font-weight="700">Cafetería PUCE Ibarra</text><text x="36" y="161" font-size="14" font-weight="400">Reservas de catering · Demostración</text><rect x="36" y="172" width="136" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="50" y="202" font-size="16" font-weight="700">Servicios</text><rect x="184" y="172" width="166" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="198" y="202" font-size="16" font-weight="700">Mis solicitudes</text><text x="20" y="264" font-size="22" font-weight="700">1  Bienvenida</text><text x="20" y="292" font-size="14" font-weight="400">Organiza el catering de tu evento.</text><text x="20" y="318" font-size="14" font-weight="400">Elige, completa tus datos y revisa tu solicitud.</text><text x="20" y="372" font-size="22" font-weight="700">2  Explorar servicios</text><text x="20" y="400" font-size="14" font-weight="400">Paso 1 de 3 · Selecciona una opción</text><rect x="20" y="422" width="350" height="200" rx="4" fill="#fff" stroke="#777"/><text x="36" y="454" font-size="21" font-weight="700">Pausa café</text><text x="36" y="487" font-size="15" font-weight="400">Para reuniones breves.</text><text x="36" y="516" font-size="15" font-weight="400">Incluye bebida y bocadito.</text><text x="36" y="542" font-size="13" font-weight="400">Contenido de ejemplo</text><rect x="36" y="558" width="318" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="50" y="588" font-size="16" font-weight="700">Elegir servicio → 3</text><rect x="20" y="642" width="350" height="200" rx="4" fill="#fff" stroke="#777"/><text x="36" y="674" font-size="21" font-weight="700">Almuerzo</text><text x="36" y="707" font-size="15" font-weight="400">Para jornadas académicas.</text><text x="36" y="736" font-size="15" font-weight="400">Incluye plato y bebida.</text><text x="36" y="762" font-size="13" font-weight="400">Contenido de ejemplo</text><rect x="36" y="778" width="318" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="50" y="808" font-size="16" font-weight="700">Elegir servicio → 3</text><rect x="20" y="862" width="350" height="200" rx="4" fill="#fff" stroke="#777"/><text x="36" y="894" font-size="21" font-weight="700">Bocaditos</text><text x="36" y="927" font-size="15" font-weight="400">Para encuentros y eventos.</text><text x="36" y="956" font-size="15" font-weight="400">Incluye surtido de bocados.</text><text x="36" y="982" font-size="13" font-weight="400">Contenido de ejemplo</text><rect x="36" y="998" width="318" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="50" y="1028" font-size="16" font-weight="700">Elegir servicio → 3</text><text x="20" y="1112" font-size="22" font-weight="700">3  Completar reserva</text><text x="20" y="1140" font-size="14" font-weight="400">Paso 2 de 3 · * Campos obligatorios</text><rect x="20" y="1162" width="350" height="80" rx="4" fill="#eee" stroke="#777"/><text x="36" y="1191" font-size="18" font-weight="700">Servicio elegido · Pausa café</text><text x="36" y="1219" font-size="14" font-weight="400">Cambiar servicio → 2 · conservar datos</text><text x="20" y="1282" font-size="18" font-weight="700">Datos del cliente</text><text x="20" y="1314" font-size="16" font-weight="700">Nombre *</text><rect x="20" y="1326" width="350" height="48" rx="4" fill="#fff" stroke="#777"/><text x="34" y="1357" font-size="16" font-weight="400">Valeria (ejemplo)</text><text x="20" y="1402" font-size="16" font-weight="700">Correo *</text><rect x="20" y="1414" width="350" height="48" rx="4" fill="#fff" stroke="#777"/><text x="34" y="1445" font-size="16" font-weight="400">valeria@example.com</text><text x="20" y="1508" font-size="18" font-weight="700">Datos del evento</text><text x="20" y="1540" font-size="16" font-weight="700">Fecha del evento *</text><rect x="20" y="1552" width="350" height="48" rx="4" fill="#fff" stroke="#777"/><text x="34" y="1583" font-size="16" font-weight="400">20/11/2026</text><text x="20" y="1628" font-size="16" font-weight="700">Cantidad de personas *</text><rect x="20" y="1640" width="350" height="48" rx="4" fill="#fff" stroke="#777"/><text x="34" y="1671" font-size="16" font-weight="400">30</text><text x="20" y="1716" font-size="14" font-weight="400">Fecha actual o futura · personas enteras &gt; 0</text><text x="20" y="1744" font-size="14" font-weight="400">Error de ejemplo · Revisa la fecha elegida.</text><text x="20" y="1784" font-size="16" font-weight="700">Observaciones (opcional)</text><rect x="20" y="1796" width="350" height="84" rx="4" fill="#fff" stroke="#777"/><text x="34" y="1827" font-size="15" font-weight="400">Indica detalles de tu evento.</text><rect x="20" y="1898" width="350" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="34" y="1928" font-size="16" font-weight="700">Revisar solicitud → 4</text><text x="20" y="1992" font-size="22" font-weight="700">4  Revisar solicitud</text><text x="20" y="2020" font-size="14" font-weight="400">Paso 3 de 3 · Comprueba los datos</text><rect x="20" y="2042" width="350" height="244" rx="4" fill="#fff" stroke="#777"/><text x="36" y="2074" font-size="16" font-weight="700">Servicio · Pausa café</text><text x="36" y="2108" font-size="16" font-weight="400">Cliente · Valeria</text><text x="36" y="2142" font-size="16" font-weight="400">Correo · valeria@example.com</text><text x="36" y="2176" font-size="16" font-weight="400">Fecha · 20/11/2026</text><text x="36" y="2210" font-size="16" font-weight="400">Personas · 30</text><text x="36" y="2244" font-size="16" font-weight="400">Observaciones · Sin observaciones</text><rect x="20" y="2306" width="350" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="34" y="2336" font-size="16" font-weight="700">Editar datos → 3</text><rect x="20" y="2370" width="350" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="34" y="2400" font-size="16" font-weight="700">Confirmar solicitud → 5</text><text x="20" y="2464" font-size="22" font-weight="700">5  Solicitud registrada</text><text x="20" y="2492" font-size="14" font-weight="400">Resultado de la confirmación</text><rect x="20" y="2514" width="350" height="142" rx="4" fill="#eee" stroke="#777"/><text x="36" y="2546" font-size="18" font-weight="700">✓ Registro simulado correcto</text><text x="36" y="2578" font-size="16" font-weight="400">Código · CAT-001</text><text x="36" y="2608" font-size="16" font-weight="700">Estado · Pendiente de revisión</text><text x="36" y="2635" font-size="14" font-weight="400">La aprobación está pendiente.</text><rect x="20" y="2676" width="350" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="34" y="2706" font-size="16" font-weight="700">Consultar mi solicitud → 6</text><text x="20" y="2770" font-size="22" font-weight="700">6  Mis solicitudes</text><text x="20" y="2798" font-size="14" font-weight="400">Consulta disponible desde la navegación</text><rect x="20" y="2820" width="350" height="160" rx="4" fill="#fff" stroke="#777"/><text x="36" y="2852" font-size="16" font-weight="700">CAT-001 · Pausa café</text><text x="36" y="2885" font-size="16" font-weight="400">20/11/2026 · 30 personas</text><text x="36" y="2918" font-size="16" font-weight="700">Pendiente de revisión</text><text x="36" y="2951" font-size="16" font-weight="400">Estado demostrativo</text><text x="20" y="3010" font-size="14" font-weight="400">Variante inicial · Aún no tienes solicitudes.</text><rect x="20" y="3030" width="350" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="34" y="3060" font-size="16" font-weight="700">Explorar servicios → 2</text><text x="20" y="3114" font-size="13" font-weight="400">Datos disponibles mientras la página esté abierta.</text><text x="20" y="3142" font-size="13" font-weight="400">Al recargar se reinicia la demostración.</text></g></svg>