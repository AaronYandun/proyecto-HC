<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2700" viewBox="0 0 1100 2700" role="img" aria-labelledby="title desc"><title id="title">Wireframe de catering para escritorio</title><desc id="desc">Vistas consecutivas de catálogo, formulario, revisión, confirmación y consulta. Las flechas indican destinos.</desc><rect width="100%" height="100%" fill="#f5f5f5"/><g font-family="Arial, sans-serif" fill="#222"><text x="48" y="32" font-size="14" font-weight="700">TALLER S7 · WIREFRAME</text><text x="48" y="57" font-size="14" font-weight="400">Escritorio · 1100 px</text><text x="48" y="82" font-size="14" font-weight="400">Secuencia de vistas · leer de arriba abajo</text><rect x="48" y="108" width="1004" height="84" rx="4" fill="#eee" stroke="#777"/><text x="64" y="138" font-size="22" font-weight="700">Cafetería PUCE Ibarra</text><text x="64" y="161" font-size="14" font-weight="400">Reservas de catering · Demostración</text><rect x="700" y="126" width="136" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="714" y="156" font-size="16" font-weight="700">Servicios</text><rect x="848" y="126" width="166" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="862" y="156" font-size="16" font-weight="700">Mis solicitudes</text><text x="48" y="232" font-size="22" font-weight="700">1  Bienvenida</text><text x="48" y="260" font-size="14" font-weight="400">Organiza el catering de tu evento.</text><text x="48" y="286" font-size="14" font-weight="400">Elige, completa tus datos y revisa tu solicitud.</text><text x="48" y="340" font-size="22" font-weight="700">2  Explorar servicios</text><text x="48" y="368" font-size="14" font-weight="400">Paso 1 de 3 · Selecciona una opción</text><rect x="48.0" y="390" width="324.0" height="200" rx="4" fill="#fff" stroke="#777"/><text x="64.0" y="422" font-size="21" font-weight="700">Pausa café</text><text x="64.0" y="455" font-size="15" font-weight="400">Para reuniones breves.</text><text x="64.0" y="484" font-size="15" font-weight="400">Incluye bebida y bocadito.</text><text x="64.0" y="510" font-size="13" font-weight="400">Contenido de ejemplo</text><rect x="64.0" y="526" width="292.0" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="78.0" y="556" font-size="16" font-weight="700">Elegir servicio → 3</text><rect x="388.0" y="390" width="324.0" height="200" rx="4" fill="#fff" stroke="#777"/><text x="404.0" y="422" font-size="21" font-weight="700">Almuerzo</text><text x="404.0" y="455" font-size="15" font-weight="400">Para jornadas académicas.</text><text x="404.0" y="484" font-size="15" font-weight="400">Incluye plato y bebida.</text><text x="404.0" y="510" font-size="13" font-weight="400">Contenido de ejemplo</text><rect x="404.0" y="526" width="292.0" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="418.0" y="556" font-size="16" font-weight="700">Elegir servicio → 3</text><rect x="728.0" y="390" width="324.0" height="200" rx="4" fill="#fff" stroke="#777"/><text x="744.0" y="422" font-size="21" font-weight="700">Bocaditos</text><text x="744.0" y="455" font-size="15" font-weight="400">Para encuentros y eventos.</text><text x="744.0" y="484" font-size="15" font-weight="400">Incluye surtido de bocados.</text><text x="744.0" y="510" font-size="13" font-weight="400">Contenido de ejemplo</text><rect x="744.0" y="526" width="292.0" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="758.0" y="556" font-size="16" font-weight="700">Elegir servicio → 3</text><text x="48" y="630" font-size="22" font-weight="700">3  Completar reserva</text><text x="48" y="658" font-size="14" font-weight="400">Paso 2 de 3 · * Campos obligatorios</text><rect x="48" y="680" width="1004" height="80" rx="4" fill="#eee" stroke="#777"/><text x="64" y="709" font-size="18" font-weight="700">Servicio elegido · Pausa café</text><text x="64" y="737" font-size="14" font-weight="400">Cambiar servicio → 2 · conservar datos</text><text x="48" y="800" font-size="18" font-weight="700">Datos del cliente</text><text x="48" y="832" font-size="16" font-weight="700">Nombre *</text><rect x="48" y="844" width="1004" height="48" rx="4" fill="#fff" stroke="#777"/><text x="62" y="875" font-size="16" font-weight="400">Valeria (ejemplo)</text><text x="48" y="920" font-size="16" font-weight="700">Correo *</text><rect x="48" y="932" width="1004" height="48" rx="4" fill="#fff" stroke="#777"/><text x="62" y="963" font-size="16" font-weight="400">valeria@example.com</text><text x="48" y="1026" font-size="18" font-weight="700">Datos del evento</text><text x="48" y="1058" font-size="16" font-weight="700">Fecha del evento *</text><rect x="48" y="1070" width="1004" height="48" rx="4" fill="#fff" stroke="#777"/><text x="62" y="1101" font-size="16" font-weight="400">20/11/2026</text><text x="48" y="1146" font-size="16" font-weight="700">Cantidad de personas *</text><rect x="48" y="1158" width="1004" height="48" rx="4" fill="#fff" stroke="#777"/><text x="62" y="1189" font-size="16" font-weight="400">30</text><text x="48" y="1234" font-size="14" font-weight="400">Fecha actual o futura · personas enteras &gt; 0</text><text x="48" y="1262" font-size="14" font-weight="400">Error de ejemplo · Revisa la fecha elegida.</text><text x="48" y="1302" font-size="16" font-weight="700">Observaciones (opcional)</text><rect x="48" y="1314" width="1004" height="84" rx="4" fill="#fff" stroke="#777"/><text x="62" y="1345" font-size="15" font-weight="400">Indica detalles de tu evento.</text><rect x="48" y="1416" width="1004" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="62" y="1446" font-size="16" font-weight="700">Revisar solicitud → 4</text><text x="48" y="1510" font-size="22" font-weight="700">4  Revisar solicitud</text><text x="48" y="1538" font-size="14" font-weight="400">Paso 3 de 3 · Comprueba los datos</text><rect x="48" y="1560" width="1004" height="244" rx="4" fill="#fff" stroke="#777"/><text x="64" y="1592" font-size="16" font-weight="700">Servicio · Pausa café</text><text x="64" y="1626" font-size="16" font-weight="400">Cliente · Valeria</text><text x="64" y="1660" font-size="16" font-weight="400">Correo · valeria@example.com</text><text x="64" y="1694" font-size="16" font-weight="400">Fecha · 20/11/2026</text><text x="64" y="1728" font-size="16" font-weight="400">Personas · 30</text><text x="64" y="1762" font-size="16" font-weight="400">Observaciones · Sin observaciones</text><rect x="48" y="1824" width="1004" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="62" y="1854" font-size="16" font-weight="700">Editar datos → 3</text><rect x="48" y="1888" width="1004" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="62" y="1918" font-size="16" font-weight="700">Confirmar solicitud → 5</text><text x="48" y="1982" font-size="22" font-weight="700">5  Solicitud registrada</text><text x="48" y="2010" font-size="14" font-weight="400">Resultado de la confirmación</text><rect x="48" y="2032" width="1004" height="142" rx="4" fill="#eee" stroke="#777"/><text x="64" y="2064" font-size="18" font-weight="700">✓ Registro simulado correcto</text><text x="64" y="2096" font-size="16" font-weight="400">Código · CAT-001</text><text x="64" y="2126" font-size="16" font-weight="700">Estado · Pendiente de revisión</text><text x="64" y="2153" font-size="14" font-weight="400">La aprobación está pendiente.</text><rect x="48" y="2194" width="1004" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="62" y="2224" font-size="16" font-weight="700">Consultar mi solicitud → 6</text><text x="48" y="2288" font-size="22" font-weight="700">6  Mis solicitudes</text><text x="48" y="2316" font-size="14" font-weight="400">Consulta disponible desde la navegación</text><rect x="48" y="2338" width="1004" height="160" rx="4" fill="#fff" stroke="#777"/><text x="64" y="2370" font-size="16" font-weight="700">CAT-001 · Pausa café</text><text x="64" y="2403" font-size="16" font-weight="400">20/11/2026 · 30 personas</text><text x="64" y="2436" font-size="16" font-weight="700">Pendiente de revisión</text><text x="64" y="2469" font-size="16" font-weight="400">Estado demostrativo</text><text x="48" y="2528" font-size="14" font-weight="400">Variante inicial · Aún no tienes solicitudes.</text><rect x="48" y="2548" width="1004" height="48" rx="4" fill="#dedede" stroke="#777"/><text x="62" y="2578" font-size="16" font-weight="700">Explorar servicios → 2</text><text x="48" y="2632" font-size="13" font-weight="400">Datos disponibles mientras la página esté abierta.</text><text x="48" y="2660" font-size="13" font-weight="400">Al recargar se reinicia la demostración.</text></g></svg>